name: Run Changed Notebooks

# Gates notebook changes on a successful Wherobots job run. A notebook whose code
# cells changed is converted to a Python script and executed on a `tiny` runtime;
# if the run fails, the reason is posted as a comment on the pull request.

on:
  pull_request:
    paths:
      - '**/*.ipynb'
      - '.github/workflows/test-changed-notebooks.yml'
      - '.github/workflows/scripts/run_changed_notebooks.py'
      - '.github/workflows/config/**'

permissions:
  contents: read
  pull-requests: write

# One run per PR. A new push cancels the in-flight run so we don't pay for
# compute validating a commit that has already been superseded.
concurrency:
  group: run-changed-notebooks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WHEROBOTS_CLI_VERSION: v1.2.0

jobs:
  run-notebooks:
    name: Run changed notebooks as Wherobots jobs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Full history so the base commit is available for the code-cell diff.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nbconvert
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert

      - name: Install Wherobots CLI
        run: |
          curl -fsSL -o /usr/local/bin/wherobots \
            "https://github.com/wherobots/wherobots-cli/releases/download/${WHEROBOTS_CLI_VERSION}/wherobots_linux_amd64"
          chmod +x /usr/local/bin/wherobots
          wherobots --version

      - name: Run changed notebooks
        env:
          WHEROBOTS_API_KEY: ${{ secrets.WHEROBOTS_API_KEY }}
        run: |
          python .github/workflows/scripts/run_changed_notebooks.py \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --runtime tiny \
            --report notebook-run-results/report.md

      # A cancelled workflow (superseded push, manual cancel, job timeout) leaves
      # submitted runs billing until they finish on their own. Stop them.
      - name: Cancel orphaned job runs
        if: cancelled() || failure()
        env:
          WHEROBOTS_API_KEY: ${{ secrets.WHEROBOTS_API_KEY }}
        run: |
          [[ -f notebook-run-results/run_ids.txt ]] || exit 0
          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            status=$(wherobots api runs get-job-run --run-id "$run_id" \
              | python -c 'import json,sys; print(json.load(sys.stdin)["status"])' 2>/dev/null || echo UNKNOWN)
            if [[ "$status" == "PENDING" || "$status" == "RUNNING" ]]; then
              echo "Cancelling $run_id (was $status)"
              wherobots api runs cancel cancel-job-run --run-id "$run_id" --yes > /dev/null || true
            fi
          done < notebook-run-results/run_ids.txt

      - name: Upload converted scripts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-run-results
          path: notebook-run-results/
          if-no-files-found: ignore

      - name: Comment results on the PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/workflows/scripts/comment_notebook_results.sh
